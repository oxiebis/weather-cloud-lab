global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules.yml]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: node                       # метрики ОС кожної VM (node_exporter, порт 9100)
    static_configs:
      - {targets: ["10.1.1.10:9100"], labels: {host: s1-web}}
      - {targets: ["10.2.1.10:9100"], labels: {host: s2-backup}}
      - {targets: ["10.3.1.10:9100"], labels: {host: s3-monitoring}}
      - {targets: ["10.4.1.10:9100"], labels: {host: s4-database}}
      - {targets: ["10.5.1.10:9100"], labels: {host: s5-loadtest}}
  - job_name: cadvisor                   # контейнери S1
    static_configs: [{targets: ["10.1.1.10:8081"], labels: {host: s1-web}}]
  - job_name: web                        # застосунок: кожна репліка окремо
    static_configs:
      - {targets: ["10.1.1.10:9101"], labels: {replica: web1}}
      - {targets: ["10.1.1.10:9102"], labels: {replica: web2}}
      - {targets: ["10.1.1.10:9103"], labels: {replica: web3}}
  - job_name: collector
    static_configs: [{targets: ["10.4.1.10:9200"], labels: {host: s4-database}}]
  - job_name: postgres
    static_configs: [{targets: ["10.4.1.10:9187"], labels: {host: s4-database}}]
  - job_name: blackbox_http              # зовнішня перевірка сайту «очима користувача»
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: ["http://10.1.1.10/nginx-health", "http://10.1.1.10/api/weather"]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox:9115"}
